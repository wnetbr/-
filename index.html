<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Protegido</title>
    <style>
        /* Reset e Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #f0f2f5; /* Cor de fundo do seu "App" */
        }

        /* TELA DE ACESSO (O OVERLAY QUE PRECISA SUMIR) */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 99999; /* Garante que fique acima de tudo */
            transition: opacity 0.5s ease;
        }

        /* Card de Acesso Centralizado */
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        .login-card h2 {
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .login-card p {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Estilo do Input */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            font-size: 16px;
            background: #f9f9f9;
        }

        .input-group input:focus {
            border-color: #4e73df;
            background: #fff;
            box-shadow: 0 0 10px rgba(78, 115, 223, 0.1);
        }

        /* Bot茫o de Acesso */
        .btn-access {
            width: 100%;
            padding: 16px;
            background: #4e73df;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(78, 115, 223, 0.3);
        }

        .btn-access:hover {
            background: #2e59d9;
            transform: translateY(-2px);
        }

        /* Mensagem de Erro */
        #error-message {
            color: #e74a3b;
            font-size: 13px;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 600;
            display: none; /* Escondido por padr茫o */
        }

        /* ANIMA脟脙O DE VIBRA脟脙O PARA ERRO */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* -------------------------------------------------- */
        /* 脕REA DO SEU APLICATIVO (O QUE EST脕 POR TR脕S)       */
        /* -------------------------------------------------- */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: #333;
        }

        .app-content-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        .app-content-card h1 {
            color: #4e73df;
            margin-bottom: 15px;
        }

        .btn-logout {
            margin-top: 20px;
            padding: 10px 20px;
            background: #f8f9fc;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- TELA DE ACESSO (OVERLAY) -->
    <div id="login-overlay">
        <div class="login-card" id="card-box">
            <h2>Acesso Restrito</h2>
            <p>Digite sua senha para entrar no App</p>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha secreta" autocomplete="off">
            </div>

            <button class="btn-access" onclick="handleLogin()">ENTRAR AGORA</button>
            
            <div id="error-message">Senha inv谩lida! Tente novamente.</div>
        </div>
    </div>

    <script>
        /**
         * BANCO DE DADOS DE SENHA
         * Altere o valor abaixo para mudar a senha do seu app.
         */
        const SENHA_DO_BANCO = "1234"; 

        function handleLogin() {
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');
            const loginOverlay = document.getElementById('login-overlay');
            const cardBox = document.getElementById('card-box');

            const senhaDigitada = passwordInput.value;

            if (senhaDigitada === SENHA_DO_BANCO) {
                // --- SENHA CORRETA ---
                
                // 1. Efeito de sumi莽o (fade out)
                loginOverlay.style.opacity = "0";
                
                // 2. Remove o elemento completamente ap贸s a anima莽茫o (0.5s)
                // Isso garante que ele n茫o bloqueie cliques no app por tr谩s.
                setTimeout(() => {
                    loginOverlay.style.display = "none";
                }, 500);

                console.log("Acesso Liberado!");

            } else {
                // --- SENHA INCORRETA ---
                
                // 1. Limpa o campo
                passwordInput.value = "";
                passwordInput.focus();

                // 2. Exibe a mensagem de erro
                errorMessage.style.display = "block";
                errorMessage.innerText = "Acesso Negado: Senha Incorreta.";

                // 3. Efeito de vibra莽茫o no card
                cardBox.classList.remove('shake');
                void cardBox.offsetWidth; // Truque para reiniciar anima莽茫o CSS
                cardBox.classList.add('shake');

                // 4. Esconde o erro ap贸s 3 segundos
                setTimeout(() => {
                    errorMessage.style.opacity = "0";
                    setTimeout(() => {
                        errorMessage.style.display = "none";
                        errorMessage.style.opacity = "1";
                    }, 300);
                }, 3000);
            }
        }

        // Permitir entrar apertando a tecla ENTER
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>

</body>
</html>
