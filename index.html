<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>wnet.chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --apple-blue: #007AFF;
            --apple-gray: #8E8E93;
            --apple-bg: #F2F2F7;
            --apple-card: #FFFFFF;
            --apple-text: #000000;
            --apple-bubble-me: #007AFF;
            --apple-bubble-them: #E9E9EB;
            --apple-red: #FF3B30;
            --apple-green: #34C759;
            --apple-light-gray: #D1D1D6;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --apple-bg: #000000;
                --apple-card: #1C1C1E;
                --apple-text: #FFFFFF;
                --apple-bubble-them: #262629;
                --apple-light-gray: #3A3A3C;
            }
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-user-select: none;
            user-select: none;
        }
        
        input, textarea { user-select: text; -webkit-user-select: text; }

        body { 
            margin: 0; 
            background-color: var(--apple-bg); 
            color: var(--apple-text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Screens */
        .screen { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
            position: absolute; 
            inset: 0; 
            background: var(--apple-bg); 
            z-index: 1; 
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }
        .screen.active { display: flex; z-index: 2; }

        /* Header */
        header {
            padding: 15px 20px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--apple-light-gray);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            flex-shrink: 0;
        }
        @media (prefers-color-scheme: dark) { header { background: rgba(28,28,30,0.8); } }

        /* Profile Styles */
        .profile-pic { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: var(--apple-light-gray); flex-shrink: 0; }
        .profile-pic-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 4px solid var(--apple-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* Contacts List */
        .contact-item {
            padding: 12px 20px;
            background: var(--apple-card);
            border-bottom: 0.5px solid var(--apple-light-gray);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            min-height: 70px;
        }
        .contact-item:active { background: var(--apple-light-gray); }
        .contact-info { flex: 1; overflow: hidden; }
        .contact-name { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-status { font-size: 13px; color: var(--apple-gray); display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .status-online { background: var(--apple-green); }
        .status-offline { background: var(--apple-gray); }

        /* Notification Badge */
        .unread-badge {
            background: var(--apple-blue);
            color: white;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            padding: 0 6px;
        }

        /* QR Scanner Fix */
        #reader { 
            width: 100% !important; 
            max-width: 400px; 
            margin: auto; 
            border-radius: 20px; 
            overflow: hidden; 
            border: none !important;
            background: #000;
            min-height: 250px;
        }
        #reader video { 
            width: 100% !important; 
            height: auto !important; 
            border-radius: 20px; 
            object-fit: cover;
        }

        /* Buttons & Inputs */
        .apple-btn { padding: 14px 20px; border-radius: 14px; border: none; background: var(--apple-blue); color: white; font-weight: 600; cursor: pointer; font-size: 16px; transition: opacity 0.2s; }
        .apple-btn:active { opacity: 0.7; }
        .apple-input { padding: 14px; border-radius: 12px; border: 1px solid var(--apple-light-gray); background: var(--apple-card); color: var(--apple-text); width: 100%; margin-bottom: 10px; font-size: 16px; outline: none; }
        .apple-input:focus { border-color: var(--apple-blue); }

        /* Chat Messages */
        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background-color: var(--apple-bg);
            background-size: cover;
            background-position: center;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .message { max-width: 85%; padding: 10px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; position: relative; word-wrap: break-word; z-index: 2; }
        .message.me { align-self: flex-end; background: var(--apple-blue); color: white; border-bottom-right-radius: 4px; }
        .message.them { align-self: flex-start; background: var(--apple-bubble-them); color: var(--apple-text); border-bottom-left-radius: 4px; }
        .message img, .message video { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; cursor: pointer; }
        
        /* Media Overlay */
        .media-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .media-overlay img, .media-overlay video {
            max-width: 95%;
            max-height: 80%;
            border-radius: 10px;
        }
        .media-controls {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 20px;
        }
        .media-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* Message Status */
        .msg-status { font-size: 10px; margin-left: 5px; vertical-align: middle; }
        .msg-status.sent { color: rgba(255,255,255,0.7); }
        .msg-status.delivered { color: rgba(255,255,255,0.9); }
        .msg-status.read { color: #00E5FF; }

        /* Input Area */
        .input-area { 
            padding: 10px 15px; 
            background: var(--apple-card); 
            display: flex; 
            align-items: flex-end; 
            gap: 10px; 
            border-top: 0.5px solid var(--apple-light-gray); 
            z-index: 10;
            flex-shrink: 0;
        }
        .input-container { flex: 1; background: var(--apple-bg); border: 0.5px solid var(--apple-light-gray); border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; }
        #message-input { flex: 1; border: none; background: transparent; color: var(--apple-text); font-size: 16px; padding: 8px 0; outline: none; }

        /* Video Call Overlay */
        #video-call-overlay { display: none; position: fixed; inset: 0; background: black; z-index: 1000; flex-direction: column; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 40px; right: 20px; width: 110px; height: 160px; border-radius: 15px; object-fit: cover; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .call-controls { position: absolute; bottom: 50px; left: 0; right: 0; display: flex; justify-content: center; gap: 25px; }
        .call-btn { width: 65px; height: 65px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; cursor: pointer; transition: transform 0.2s; }
        .call-btn:active { transform: scale(0.9); }
        .btn-hangup { background: var(--apple-red); }
        .btn-action { background: rgba(255,255,255,0.2); backdrop-filter: blur(15px); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--apple-card); border-radius: 20px; padding: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }

        /* Recording UI */
        #recording-ui { display: none; position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 25px; align-items: center; gap: 10px; z-index: 50; }
    
        /* Tablet & Desktop Optimizations */
        @media (min-width: 768px) {
            .screen { max-width: 500px; margin: 0 auto; border-left: 0.5px solid var(--apple-light-gray); border-right: 0.5px solid var(--apple-light-gray); }
            body { background: #E5E5EA; }
        }

        /* Wallpaper Settings */
        .wallpaper-option {
            width: 100%;
            padding: 15px;
            background: var(--apple-card);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid var(--apple-light-gray);
        }
    </style>
</head>
<body>

    <!-- Main Screen (Conversas) -->
    <div id="main-screen" class="screen active">
        <header>
            <h1 style="font-size: 34px; margin: 0; font-weight: 800;">Mensagens</h1>
            <div style="display: flex; gap: 15px;">
                <button class="icon-btn" onclick="showScreen('contacts-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 24px;"><i class="fas fa-address-book"></i></button>
                <button class="icon-btn" onclick="showScreen('profile-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 24px;"><i class="fas fa-user-circle"></i></button>
                <button class="icon-btn" onclick="showScreen('add-contact-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 24px;"><i class="fas fa-plus-circle"></i></button>
            </div>
        </header>
        <div id="conversations-list" style="flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;">
            <!-- Conversations will appear here -->
        </div>
    </div>

    <!-- Contacts Screen -->
    <div id="contacts-screen" class="screen">
        <header>
            <button onclick="showScreen('main-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 17px; font-weight: 500;"><i class="fas fa-chevron-left"></i> Voltar</button>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Contatos</h2>
            <div style="width: 60px;"></div>
        </header>
        <div id="all-contacts-list" style="flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;">
            <!-- All saved contacts will appear here -->
        </div>
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen" class="screen">
        <header>
            <button onclick="showScreen('main-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 17px; font-weight: 500;"><i class="fas fa-chevron-left"></i> Voltar</button>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Meu Perfil</h2>
            <div style="width: 60px;"></div>
        </header>
        <div style="padding: 30px; display: flex; flex-direction: column; align-items: center; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;">
            <div style="position: relative;">
                <img id="my-profile-pic-display" class="profile-pic-large" src="https://www.w3schools.com/howto/img_avatar.png">
                <button onclick="document.getElementById('profile-pic-input').click()" style="position: absolute; bottom: 20px; right: 0; background: var(--apple-blue); color: white; border: none; width: 35px; height: 35px; border-radius: 50%;"><i class="fas fa-camera"></i></button>
            </div>
            <input type="file" id="profile-pic-input" hidden accept="image/*" onchange="updateProfilePic()">
            
            <p style="color: var(--apple-gray); margin-bottom: 5px; font-size: 13px; text-transform: uppercase; width: 100%; max-width: 300px;">Nome de Usuário</p>
            <input type="text" id="username-input" class="apple-input" style="max-width: 300px;" placeholder="Seu nome">
            <button class="apple-btn" onclick="saveProfile()" style="width: 100%; max-width: 300px; margin-top: 10px;">Salvar Alterações</button>

            <button class="apple-btn" onclick="showScreen('wallpaper-screen')" style="width: 100%; max-width: 300px; margin-top: 15px; background: var(--apple-gray);"><i class="fas fa-image"></i> Papel de Parede</button>

            <div style="margin-top: 40px; text-align: center; width: 100%; background: var(--apple-card); padding: 20px; border-radius: 20px;">
                <p style="color: var(--apple-gray); margin-bottom: 10px;">Seu Código de Conexão</p>
                <div id="my-id-display" style="font-size: 28px; font-weight: 800; letter-spacing: 6px; color: var(--apple-blue); margin-bottom: 15px;">----</div>
                <div id="qrcode-display" style="margin-bottom: 15px; display: flex; justify-content: center;"></div>
                <button class="apple-btn" onclick="copyMyId()" style="background: var(--apple-light-gray); color: var(--apple-text); width: 100%;"><i class="fas fa-copy"></i> Copiar Código</button>
            </div>
        </div>
    </div>

    <!-- Wallpaper Screen -->
    <div id="wallpaper-screen" class="screen">
        <header>
            <button onclick="showScreen('profile-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 17px; font-weight: 500;"><i class="fas fa-chevron-left"></i> Voltar</button>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Papel de Parede</h2>
            <div style="width: 60px;"></div>
        </header>
        <div style="padding: 20px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;">
            <p style="color: var(--apple-gray); margin-bottom: 15px; font-size: 13px; text-transform: uppercase;">Personalizar Fundo do Chat</p>
            
            <div class="wallpaper-option" onclick="document.getElementById('wallpaper-color-input').click()">
                <span>Cor Sólida</span>
                <input type="color" id="wallpaper-color-input" style="width: 40px; height: 40px; border: none; padding: 0; background: none;" onchange="updateWallpaperColor(this.value)">
            </div>

            <div class="wallpaper-option" onclick="document.getElementById('wallpaper-image-input').click()">
                <span>Foto da Galeria</span>
                <i class="fas fa-chevron-right" style="color: var(--apple-gray);"></i>
            </div>
            <input type="file" id="wallpaper-image-input" hidden accept="image/*" onchange="updateWallpaperImage()">

            <button class="apple-btn" onclick="resetWallpaper()" style="width: 100%; margin-top: 20px; background: var(--apple-red);">Restaurar Padrão</button>
        </div>
    </div>

    <!-- Add Contact Screen -->
    <div id="add-contact-screen" class="screen">
        <header>
            <button onclick="showScreen('main-screen'); stopScanner();" style="background:none; border:none; color:var(--apple-blue); font-size: 17px; font-weight: 500;"><i class="fas fa-chevron-left"></i> Voltar</button>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Novo Contato</h2>
            <div style="width: 60px;"></div>
        </header>
        <div style="padding: 20px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;">
            <div id="scanner-container" style="width: 100%; max-width: 400px; margin: 0 auto 20px auto; position: relative;">
                <div id="reader"></div>
                <div id="scanner-placeholder" style="position: absolute; inset: 0; background: #000; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: white; z-index: 5;">
                    <p id="start-scan-btn" onclick="startScanner()" style="cursor: pointer; text-align: center;"><i class="fas fa-camera" style="font-size: 40px;"></i><br>Abrir Câmera</p>
                </div>
            </div>
            
            <p style="color: var(--apple-gray); margin-bottom: 5px; font-size: 13px; text-transform: uppercase;">Adicionar Manualmente</p>
            <input type="text" id="contact-name-input" class="apple-input" placeholder="Nome do contato">
            <input type="text" id="manual-id-input" class="apple-input" placeholder="Código de 4 dígitos" maxlength="4" inputmode="numeric">
            <button class="apple-btn" onclick="addContactManual()" style="width: 100%; margin-top: 10px;">Adicionar Contato</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
        <header>
            <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                <button onclick="showScreen('main-screen')" style="background:none; border:none; color:var(--apple-blue); font-size: 17px; font-weight: 500; flex-shrink: 0;"><i class="fas fa-chevron-left"></i></button>
                <img id="chat-profile-pic" class="profile-pic" src="https://www.w3schools.com/howto/img_avatar.png" onclick="showContactProfile(activeChatId)">
                <div onclick="showContactProfile(activeChatId)" style="overflow: hidden;">
                    <div id="chat-username" style="font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Nome</div>
                    <div class="contact-status" style="font-size: 12px;">
                        <span id="chat-status-dot" class="status-dot status-offline"></span>
                        <span id="chat-status-text">Offline</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 15px; flex-shrink: 0;">
                <button class="icon-btn" onclick="startCall(false)" style="background:none; border:none; color:var(--apple-blue); font-size: 20px;"><i class="fas fa-phone"></i></button>
                <button class="icon-btn" onclick="startCall(true)" style="background:none; border:none; color:var(--apple-blue); font-size: 20px;"><i class="fas fa-video"></i></button>
            </div>
        </header>
        
        <div id="messages"></div>

        <div id="recording-ui">
            <i class="fas fa-microphone" style="color: var(--apple-red); animation: pulse 1s infinite;"></i>
            <span>Gravando áudio...</span>
        </div>

        <div class="input-area">
            <button onclick="document.getElementById('file-input').click()" style="background:none; border:none; color:var(--apple-blue); font-size: 24px;"><i class="fas fa-plus"></i></button>
            <input type="file" id="file-input" hidden onchange="sendFile()">
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Mensagem" autocomplete="off">
            </div>
            <button id="voice-btn" style="background:none; border:none; color:var(--apple-blue); font-size: 24px;"><i class="fas fa-microphone"></i></button>
            <button id="send-btn" onclick="sendMessage()" style="background:none; border:none; color:var(--apple-blue); font-size: 24px; display: none;"><i class="fas fa-arrow-up-circle"></i></button>
        </div>
    </div>

    <!-- Media Overlay -->
    <div id="media-overlay" class="media-overlay">
        <div class="media-controls">
            <button class="media-btn" id="download-media-btn"><i class="fas fa-download"></i></button>
            <button class="media-btn" onclick="closeMediaOverlay()"><i class="fas fa-times"></i></button>
        </div>
        <div id="media-content" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;"></div>
    </div>

    <!-- Video Call Overlay -->
    <div id="video-call-overlay">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <div class="call-controls">
            <button class="call-btn btn-action" onclick="toggleMute()"><i id="call-mute-icon" class="fas fa-microphone"></i></button>
            <button class="call-btn btn-hangup" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
            <button class="call-btn btn-action" onclick="toggleCamera()"><i id="call-camera-icon" class="fas fa-video"></i></button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="modal-overlay">
        <div class="modal-content">
            <img id="caller-pic" class="profile-pic-large" src="https://www.w3schools.com/howto/img_avatar.png">
            <h3 id="caller-name">Chamada de...</h3>
            <p>Chamada de voz/vídeo recebida</p>
            <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
                <button class="call-btn btn-hangup" onclick="rejectCall()"><i class="fas fa-times"></i></button>
                <button class="call-btn" style="background: var(--apple-green);" onclick="acceptCall()"><i class="fas fa-phone"></i></button>
            </div>
        </div>
    </div>

    <!-- Contact Profile Modal -->
    <div id="contact-profile-modal" class="modal-overlay" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="contact-profile-pic-modal" class="profile-pic-large" src="">
            <div style="margin-bottom: 15px;">
                <p style="color: var(--apple-gray); font-size: 12px; text-transform: uppercase; margin-bottom: 5px;">Nome do Contato</p>
                <input type="text" id="contact-edit-name-input" class="apple-input" style="text-align: center; margin-bottom: 5px;">
                <button class="apple-btn" style="padding: 8px 15px; font-size: 14px; width: 100%;" onclick="updateContactName()">Salvar Nome</button>
            </div>
            <p id="contact-profile-id-modal" style="font-weight: 600; color: var(--apple-blue); margin: 15px 0;"></p>
            <button class="apple-btn" style="background: var(--apple-red); width: 100%;" onclick="deleteConversation(event, activeChatId)">Apagar Conversa</button>
            <button class="apple-btn" style="background: #555; width: 100%; margin-top: 10px;" onclick="removeContactCompletely(event, activeChatId)">Excluir Contato Permanentemente</button>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        let myId = localStorage.getItem('apple_p2p_id_v4');
        let myProfile = JSON.parse(localStorage.getItem('apple_p2p_profile_v4') || '{"name":"","pic":""}');
        let contacts = JSON.parse(localStorage.getItem('apple_p2p_contacts_v4') || '{}');
        let deletedConversations = JSON.parse(localStorage.getItem('apple_p2p_deleted_conv_v4') || '{}');
        let messagesStore = JSON.parse(localStorage.getItem('apple_p2p_messages_v4') || '{}');
        let unreadCounts = JSON.parse(localStorage.getItem('apple_p2p_unread_v4') || '{}');
        let wallpaper = JSON.parse(localStorage.getItem('apple_p2p_wallpaper_v4') || '{"type":"default","value":""}');
        
        let peer = null;
        let conn = null;
        let activeChatId = null;
        let localStream = null;
        let currentCall = null;
        let html5QrCode = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let onlineStatusMap = {};
        let statusCheckInterval = null;

        // --- AUDIO ASSETS ---
        const notificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');
        const ringtoneSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3');
        ringtoneSound.loop = true;

        // --- INITIALIZATION ---
        function init() {
            if(!myId) {
                myId = Math.floor(1000 + Math.random() * 9000).toString();
                localStorage.setItem('apple_p2p_id_v4', myId);
            }
            document.getElementById('my-id-display').innerText = myId;
            document.getElementById('username-input').value = myProfile.name;
            if(myProfile.pic) document.getElementById('my-profile-pic-display').src = myProfile.pic;
            
            generateQR(JSON.stringify({id: myId, name: myProfile.name}));
            applyWallpaper();
            updateConversationsList();

            peer = new Peer("apple-p2p-v4-" + myId, {
                debug: 1,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', id => {
                console.log('My peer ID is: ' + id);
                startStatusMonitoring();
            });

            peer.on('connection', handleIncomingConnection);
            
            peer.on('call', call => {
                const id = call.peer.replace('apple-p2p-v4-', '');
                currentCall = call;
                const c = contacts[id] || {name: "Amigo " + id};
                document.getElementById('caller-name').innerText = getContactDisplayName(id, c);
                document.getElementById('caller-pic').src = c.pic || 'https://www.w3schools.com/howto/img_avatar.png';
                document.getElementById('incoming-call-modal').style.display = 'flex';
                ringtoneSound.play().catch(e => console.log("Som bloqueado pelo navegador."));
            });

            peer.on('error', err => {
                console.error("Peer error:", err);
                if(err.type === 'unavailable-id') alert("Erro: Este ID já está em uso em outra aba.");
            });

            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            document.addEventListener('click', () => {
                notificationSound.play().then(() => { notificationSound.pause(); notificationSound.currentTime = 0; }).catch(() => {});
                ringtoneSound.play().then(() => { ringtoneSound.pause(); ringtoneSound.currentTime = 0; }).catch(() => {});
            }, { once: true });
            
            // Fix for mobile height issues
            window.addEventListener('resize', () => {
                document.body.style.height = window.innerHeight + 'px';
            });
        }

        // --- WALLPAPER LOGIC ---
        function updateWallpaperColor(color) {
            wallpaper = { type: 'color', value: color };
            localStorage.setItem('apple_p2p_wallpaper_v4', JSON.stringify(wallpaper));
            applyWallpaper();
        }

        function updateWallpaperImage() {
            const file = document.getElementById('wallpaper-image-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                wallpaper = { type: 'image', value: e.target.result };
                localStorage.setItem('apple_p2p_wallpaper_v4', JSON.stringify(wallpaper));
                applyWallpaper();
            };
            reader.readAsDataURL(file);
        }

        function resetWallpaper() {
            wallpaper = { type: 'default', value: '' };
            localStorage.setItem('apple_p2p_wallpaper_v4', JSON.stringify(wallpaper));
            applyWallpaper();
        }

        function applyWallpaper() {
            const msgContainer = document.getElementById('messages');
            if(wallpaper.type === 'color') {
                msgContainer.style.backgroundColor = wallpaper.value;
                msgContainer.style.backgroundImage = 'none';
            } else if(wallpaper.type === 'image') {
                msgContainer.style.backgroundImage = `url(${wallpaper.value})`;
                msgContainer.style.backgroundColor = 'transparent';
            } else {
                msgContainer.style.backgroundColor = '';
                msgContainer.style.backgroundImage = 'none';
            }
        }

        // --- MEDIA OVERLAY LOGIC ---
        function openMediaOverlay(src, type) {
            const overlay = document.getElementById('media-overlay');
            const content = document.getElementById('media-content');
            const downloadBtn = document.getElementById('download-media-btn');
            content.innerHTML = '';
            if(type === 'image') {
                const img = document.createElement('img');
                img.src = src;
                content.appendChild(img);
            } else if(type === 'video') {
                const video = document.createElement('video');
                video.src = src;
                video.controls = true;
                video.autoplay = true;
                content.appendChild(video);
            }
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = src;
                a.download = 'wnet_media_' + Date.now();
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            overlay.style.display = 'flex';
        }

        function closeMediaOverlay() {
            document.getElementById('media-overlay').style.display = 'none';
            document.getElementById('media-content').innerHTML = '';
        }

        // --- HELPERS ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'main-screen') {
                activeChatId = null;
                updateConversationsList();
            }
            if(id === 'contacts-screen') {
                updateAllContactsList();
            }
            if(id === 'chat-screen' && activeChatId) {
                unreadCounts[activeChatId] = 0;
                saveUnread();
                updateConversationsList();
                sendReadReceipt(activeChatId);
            }
        }

        function saveProfile() {
            myProfile.name = document.getElementById('username-input').value.trim();
            localStorage.setItem('apple_p2p_profile_v4', JSON.stringify(myProfile));
            alert("Perfil salvo!");
            generateQR(JSON.stringify({id: myId, name: myProfile.name}));
        }

        function updateProfilePic() {
            const file = document.getElementById('profile-pic-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                myProfile.pic = e.target.result;
                document.getElementById('my-profile-pic-display').src = myProfile.pic;
                localStorage.setItem('apple_p2p_profile_v4', JSON.stringify(myProfile));
            };
            reader.readAsDataURL(file);
        }

        function copyMyId() {
            navigator.clipboard.writeText(myId).then(() => alert("Código copiado!"));
        }

        function saveContacts() { localStorage.setItem('apple_p2p_contacts_v4', JSON.stringify(contacts)); }
        function saveDeletedConversations() { localStorage.setItem('apple_p2p_deleted_conv_v4', JSON.stringify(deletedConversations)); }
        function saveMessages() { localStorage.setItem('apple_p2p_messages_v4', JSON.stringify(messagesStore)); }
        function saveUnread() { localStorage.setItem('apple_p2p_unread_v4', JSON.stringify(unreadCounts)); }

        function normalizeContact(id, c) {
            if(!c) return { id: id, name: "Amigo " + id };
            return {
                id: id,
                name: c.name || c.customName || "Amigo " + id,
                customName: c.customName || c.name || "",
                profileName: c.profileName || "",
                pic: c.pic || ""
            };
        }

        function getContactDisplayName(id, c) {
            return c.customName || c.profileName || ("Amigo " + id);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- CONTACTS & CONVERSATIONS LISTS ---
        function updateConversationsList() {
            const list = document.getElementById('conversations-list');
            list.innerHTML = '';
            const conversationIds = Object.keys(messagesStore).filter(id => !deletedConversations[id]);
            
            if(conversationIds.length === 0) {
                list.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--apple-gray);">Nenhuma conversa ativa. Vá em contatos para iniciar uma.</div>';
                return;
            }

            conversationIds.forEach(id => {
                const c = normalizeContact(id, contacts[id]);
                const isOnline = onlineStatusMap[id] || false;
                const unread = unreadCounts[id] || 0;
                const lastMsg = (messagesStore[id] && messagesStore[id].length > 0) ? messagesStore[id][messagesStore[id].length-1] : null;
                
                const item = document.createElement('div');
                item.className = 'contact-item';
                item.onclick = () => openChat(id);
                item.innerHTML = `
                    <img class="profile-pic" src="${c.pic || 'https://www.w3schools.com/howto/img_avatar.png'}">
                    <div class="contact-info">
                        <div class="contact-name">${getContactDisplayName(id, c)}</div>
                        <div class="contact-status">
                            <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
                            ${lastMsg ? (lastMsg.type === 'me' ? 'Você: ' : '') + lastMsg.content.replace(/<[^>]*>?/gm, '').substring(0, 30) : (isOnline ? 'Online' : 'Offline')}
                        </div>
                    </div>
                    ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
                `;
                list.appendChild(item);
            });
        }

        function updateAllContactsList() {
            const list = document.getElementById('all-contacts-list');
            list.innerHTML = '';
            const contactIds = Object.keys(contacts);
            
            if(contactIds.length === 0) {
                list.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--apple-gray);">Nenhum contato salvo.</div>';
                return;
            }

            contactIds.forEach(id => {
                const c = normalizeContact(id, contacts[id]);
                const isOnline = onlineStatusMap[id] || false;
                
                const item = document.createElement('div');
                item.className = 'contact-item';
                item.onclick = () => {
                    delete deletedConversations[id];
                    saveDeletedConversations();
                    openChat(id);
                };
                item.innerHTML = `
                    <img class="profile-pic" src="${c.pic || 'https://www.w3schools.com/howto/img_avatar.png'}">
                    <div class="contact-info">
                        <div class="contact-name">${getContactDisplayName(id, c)}</div>
                        <div class="contact-status">ID: ${id} • ${isOnline ? 'Online' : 'Offline'}</div>
                    </div>
                    <i class="fas fa-chevron-right" style="color: var(--apple-light-gray);"></i>
                `;
                list.appendChild(item);
            });
        }

        // --- STATUS MONITORING ---
        function startStatusMonitoring() {
            if(statusCheckInterval) clearInterval(statusCheckInterval);
            checkAllStatuses();
            statusCheckInterval = setInterval(checkAllStatuses, 10000);
        }

        function checkAllStatuses() {
            Object.keys(contacts).forEach(id => probeStatus(id));
        }

        function probeStatus(id) {
            if (id === myId) return;
            if (conn && conn.open && conn.peer === "apple-p2p-v4-" + id) {
                updateStatusUI(id, true);
                return;
            }
            const tempConn = peer.connect("apple-p2p-v4-" + id, { reliable: false });
            let done = false;
            let timeout = setTimeout(() => {
                if(done) return;
                done = true;
                try { tempConn.close(); } catch(e) {}
                updateStatusUI(id, false);
            }, 3000);
            tempConn.on('open', () => {
                if(done) return;
                done = true;
                clearTimeout(timeout);
                updateStatusUI(id, true);
                try { tempConn.send({type: 'status_probe'}); } catch(e) {}
                setTimeout(() => { try { tempConn.close(); } catch(e) {} }, 500);
            });
            tempConn.on('error', () => {
                if(done) return;
                done = true;
                clearTimeout(timeout);
                updateStatusUI(id, false);
            });
        }

        function updateStatusUI(id, isOnline) {
            if (onlineStatusMap[id] === isOnline) return;
            onlineStatusMap[id] = isOnline;
            if(activeChatId === id) {
                document.getElementById('chat-status-dot').className = 'status-dot ' + (isOnline ? 'status-online' : 'status-offline');
                document.getElementById('chat-status-text').innerText = isOnline ? 'Online' : 'Offline';
            }
        }

        // --- CHAT LOGIC ---
        function openChat(id, existingConn) {
            if(!contacts[id]) return;
            activeChatId = id;
            const c = contacts[id] = normalizeContact(id, contacts[id]);
            document.getElementById('chat-username').innerText = getContactDisplayName(id, c);
            document.getElementById('chat-profile-pic').src = c.pic || 'https://www.w3schools.com/howto/img_avatar.png';
            unreadCounts[id] = 0;
            saveUnread();
            renderMessages(id);
            showScreen('chat-screen');
            if(existingConn) {
                if(conn && conn !== existingConn) conn.close();
                conn = existingConn;
                setupConnectionHandlers(conn);
                sendReadReceipt(id);
                return;
            }
            if(conn && conn.open && conn.peer === "apple-p2p-v4-" + id) {
                sendReadReceipt(id);
                return;
            }
            if(conn) conn.close();
            conn = peer.connect("apple-p2p-v4-" + id, { reliable: true });
            setupConnectionHandlers(conn);
        }

        function handleIncomingConnection(c) {
            const id = c.peer.replace('apple-p2p-v4-', '');
            let firstDataHandled = false;
            c.on('data', data => {
                if(!firstDataHandled) {
                    firstDataHandled = true;
                    if(data && data.type === 'status_probe') {
                        updateStatusUI(id, true);
                        try { c.close(); } catch(e) {}
                        return;
                    }
                    if(!contacts[id]) {
                        contacts[id] = normalizeContact(id, { name: "Novo Amigo" });
                        saveContacts();
                    }
                    delete deletedConversations[id];
                    saveDeletedConversations();
                    if(activeChatId !== id) {
                        setupConnectionHandlers(c);
                    } else {
                        if(conn && conn !== c) conn.close();
                        conn = c;
                        setupConnectionHandlers(c);
                    }
                }
                processIncomingData(c, data);
            });
            c.on('open', () => updateStatusUI(id, true));
            c.on('close', () => updateStatusUI(id, false));
        }

        function setupConnectionHandlers(c) {
            if(!c || c._handlersReady) return;
            c._handlersReady = true;
            const id = c.peer.replace('apple-p2p-v4-', '');
            c.on('open', () => {
                updateStatusUI(id, true);
                c.send({type: 'profile_sync', profile: myProfile});
                syncMessageStatus(id);
            });
            c.on('data', data => processIncomingData(c, data));
            c.on('close', () => updateStatusUI(id, false));
            c.on('error', () => updateStatusUI(id, false));
        }

        function processIncomingData(c, data) {
            if(!data || data.type === 'status_probe') return;
            const id = c.peer.replace('apple-p2p-v4-', '');
            if(data.type === 'profile_sync') {
                contacts[id] = normalizeContact(id, contacts[id]);
                contacts[id].profileName = data.profile.name || contacts[id].profileName || '';
                contacts[id].pic = data.profile.pic || contacts[id].pic || '';
                saveContacts();
                if(activeChatId === id) {
                    document.getElementById('chat-username').innerText = getContactDisplayName(id, contacts[id]);
                    document.getElementById('chat-profile-pic').src = contacts[id].pic || 'https://www.w3schools.com/howto/img_avatar.png';
                }
            } else if(data.type === 'text' || data.type === 'file') {
                let content = '';
                let msgId = data.msgId || Date.now();
                if(data.type === 'text') {
                    content = escapeHtml(data.content);
                } else {
                    const blob = new Blob([data.payload], {type: data.mime});
                    const url = URL.createObjectURL(blob);
                    if(data.mime.startsWith('image/')) content = `<img src="${url}" onclick="openMediaOverlay('${url}', 'image')">`;
                    else if(data.mime.startsWith('video/')) content = `<video src="${url}" onclick="openMediaOverlay('${url}', 'video')"></video>`;
                    else if(data.mime.startsWith('audio/')) content = `<audio controls src="${url}"></audio>`;
                    else content = `<a href="${url}" download="${escapeHtml(data.name)}"><i class="fas fa-file"></i> ${escapeHtml(data.name)}</a>`;
                }
                rememberMessage(id, content, 'them', msgId);
                if(activeChatId === id) {
                    addMessageUI(content, 'them', msgId);
                    sendReadReceipt(id);
                } else {
                    unreadCounts[id] = (unreadCounts[id] || 0) + 1;
                    saveUnread();
                    showNotification(id, data.type === 'text' ? data.content : "Arquivo recebido");
                }
                c.send({type: 'receipt', msgId: msgId, status: 'delivered'});
            } else if(data.type === 'receipt') {
                updateMessageStatus(id, data.msgId, data.status);
            }
        }

        function showNotification(id, text) {
            notificationSound.play().catch(e => console.log("Som bloqueado pelo navegador."));
            if (Notification.permission === "granted") {
                const c = contacts[id] || {name: "Amigo"};
                new Notification(getContactDisplayName(id, c), { body: text });
            }
        }

        function sendReadReceipt(id) {
            if(conn && conn.open && conn.peer === "apple-p2p-v4-" + id) {
                const msgs = messagesStore[id] || [];
                msgs.forEach(m => {
                    if(m.type === 'them' && m.status !== 'read') {
                        m.status = 'read';
                        conn.send({type: 'receipt', msgId: m.id, status: 'read'});
                    }
                });
                saveMessages();
            }
        }

        function updateMessageStatus(contactId, msgId, status) {
            const msgs = messagesStore[contactId] || [];
            const msg = msgs.find(m => m.id === msgId);
            if(msg) {
                const statusOrder = { 'sent': 1, 'delivered': 2, 'read': 3 };
                if(statusOrder[status] > (statusOrder[msg.status] || 0)) {
                    msg.status = status;
                    saveMessages();
                    if(activeChatId === contactId) renderMessages(contactId);
                }
            }
        }

        function syncMessageStatus(id) {}

        function rememberMessage(contactId, content, type, id, status = 'sent') {
            if(!messagesStore[contactId]) messagesStore[contactId] = [];
            if(!messagesStore[contactId].find(m => m.id === id)) {
                messagesStore[contactId].push({ id, content, type, status, time: Date.now() });
                saveMessages();
            }
        }

        function renderMessages(contactId) {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            const msgs = messagesStore[contactId] || [];
            msgs.forEach(m => addMessageUI(m.content, m.type, m.id, m.status));
            container.scrollTop = container.scrollHeight;
        }

        function addMessageUI(content, type, id, status) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.id = `msg-${id}`;
            let statusHtml = '';
            if(type === 'me') {
                let icon = '<i class="fas fa-check"></i>';
                let statusClass = 'sent';
                if(status === 'delivered') { icon = '<i class="fas fa-check-double"></i>'; statusClass = 'delivered'; }
                if(status === 'read') { icon = '<i class="fas fa-check-double"></i>'; statusClass = 'read'; }
                statusHtml = `<span class="msg-status ${statusClass}">${icon}</span>`;
            }
            div.innerHTML = `${content}${statusHtml}`;
            const container = document.getElementById('messages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !activeChatId) return;
            const msgId = Date.now();
            const safe = escapeHtml(text);
            input.value = '';
            document.getElementById('send-btn').style.display = 'none';
            document.getElementById('voice-btn').style.display = 'block';
            rememberMessage(activeChatId, safe, 'me', msgId, 'sent');
            addMessageUI(safe, 'me', msgId, 'sent');
            if(conn && conn.open && conn.peer === "apple-p2p-v4-" + activeChatId) {
                conn.send({type: 'text', content: text, msgId: msgId});
            } else {
                conn = peer.connect("apple-p2p-v4-" + activeChatId, { reliable: true });
                setupConnectionHandlers(conn);
                conn.on('open', () => conn.send({type: 'text', content: text, msgId: msgId}));
            }
        }

        function sendFile() {
            const file = document.getElementById('file-input').files[0];
            if(!file || !activeChatId) return;
            const msgId = Date.now();
            const reader = new FileReader();
            reader.onload = () => {
                const payload = reader.result;
                let html = '';
                const url = URL.createObjectURL(file);
                if(file.type.startsWith('image/')) html = `<img src="${url}" onclick="openMediaOverlay('${url}', 'image')">`;
                else if(file.type.startsWith('video/')) html = `<video src="${url}" onclick="openMediaOverlay('${url}', 'video')"></video>`;
                else if(file.type.startsWith('audio/')) html = `<audio controls src="${url}"></audio>`;
                else html = `<a href="${url}" download="${escapeHtml(file.name)}"><i class="fas fa-file"></i> ${escapeHtml(file.name)}</a>`;
                rememberMessage(activeChatId, html, 'me', msgId, 'sent');
                addMessageUI(html, 'me', msgId, 'sent');
                const sendData = {type: 'file', name: file.name, mime: file.type, payload: payload, msgId: msgId};
                if(conn && conn.open && conn.peer === "apple-p2p-v4-" + activeChatId) {
                    conn.send(sendData);
                } else {
                    conn = peer.connect("apple-p2p-v4-" + activeChatId, { reliable: true });
                    setupConnectionHandlers(conn);
                    conn.on('open', () => conn.send(sendData));
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- CALL LOGIC ---
        function startCall(video) {
            if(!activeChatId) return;
            const constraints = { video: video ? { facingMode: "user" } : false, audio: true };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
                document.getElementById('video-call-overlay').style.display = 'flex';
                const call = peer.call("apple-p2p-v4-" + activeChatId, stream);
                setupCallHandlers(call);
            }).catch(err => alert("Erro ao acessar câmera/microfone: " + err));
        }

        function acceptCall() {
            ringtoneSound.pause(); ringtoneSound.currentTime = 0;
            document.getElementById('incoming-call-modal').style.display = 'none';
            if(!currentCall) return;
            const constraints = { video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true } };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
                document.getElementById('video-call-overlay').style.display = 'flex';
                currentCall.answer(stream);
                setupCallHandlers(currentCall);
            }).catch(err => {
                navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
                    localStream = stream;
                    document.getElementById('video-call-overlay').style.display = 'flex';
                    currentCall.answer(stream);
                    setupCallHandlers(currentCall);
                }).catch(e => alert("Erro ao aceitar chamada: " + e));
            });
        }

        function rejectCall() {
            ringtoneSound.pause(); ringtoneSound.currentTime = 0;
            document.getElementById('incoming-call-modal').style.display = 'none';
            if(currentCall) currentCall.close();
        }

        function setupCallHandlers(call) {
            currentCall = call;
            call.on('stream', rs => {
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = rs;
                remoteVideo.play().catch(e => console.error("Play error:", e));
            });
            call.on('close', () => endCall());
            call.on('error', () => endCall());
        }

        function endCall() {
            ringtoneSound.pause(); ringtoneSound.currentTime = 0;
            if(currentCall) { try { currentCall.close(); } catch(e) {} currentCall = null; }
            if(localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            document.getElementById('video-call-overlay').style.display = 'none';
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
        }

        function toggleMute() {
            if(!localStream) return;
            const track = localStream.getAudioTracks()[0];
            if(track) { track.enabled = !track.enabled; document.getElementById('call-mute-icon').className = track.enabled ? 'fas fa-microphone' : 'fas fa-microphone-slash'; }
        }

        function toggleCamera() {
            if(!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if(track) { track.enabled = !track.enabled; document.getElementById('call-camera-icon').className = track.enabled ? 'fas fa-video' : 'fas fa-video-slash'; }
        }

        // --- VOICE RECORDING ---
        const voiceBtn = document.getElementById('voice-btn');
        const handleStartRecording = async (e) => {
            e.preventDefault();
            if(!activeChatId) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        const msgId = Date.now();
                        const payload = reader.result;
                        const url = URL.createObjectURL(blob);
                        const html = `<audio controls src="${url}"></audio>`;
                        rememberMessage(activeChatId, html, 'me', msgId, 'sent');
                        addMessageUI(html, 'me', msgId, 'sent');
                        const sendData = {type: 'file', name: 'audio.ogg', mime: 'audio/ogg', payload: payload, msgId: msgId};
                        if(conn && conn.open && conn.peer === "apple-p2p-v4-" + activeChatId) {
                            conn.send(sendData);
                        } else {
                            conn = peer.connect("apple-p2p-v4-" + activeChatId, { reliable: true });
                            setupConnectionHandlers(conn);
                            conn.on('open', () => conn.send(sendData));
                        }
                    };
                    reader.readAsArrayBuffer(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                document.getElementById('recording-ui').style.display = 'flex';
            } catch (err) { alert("Erro ao gravar: " + err); }
        };

        const handleStopRecording = (e) => {
            e.preventDefault();
            if(mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('recording-ui').style.display = 'none';
            }
        };

        voiceBtn.addEventListener('mousedown', handleStartRecording);
        voiceBtn.addEventListener('mouseup', handleStopRecording);
        voiceBtn.addEventListener('touchstart', handleStartRecording);
        voiceBtn.addEventListener('touchend', handleStopRecording);

        // --- SCANNER & CONTACTS ---
        function startScanner() {
            const placeholder = document.getElementById('scanner-placeholder');
            placeholder.style.display = 'none';
            if(html5QrCode) {
                html5QrCode.stop().catch(() => {}).finally(() => { html5QrCode = null; initScanner(); });
            } else { initScanner(); }
        }

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
            html5QrCode.start({ facingMode: "environment" }, config, 
                (decodedText) => {
                    stopScanner();
                    try {
                        const parsed = JSON.parse(decodedText);
                        addContact(parsed.id, parsed.name);
                    } catch(e) { addContact(decodedText, ""); }
                },
                (errorMessage) => {}
            ).catch(err => {
                console.error("Scanner error:", err);
                alert("Erro na câmera.");
                stopScanner();
            });
        }

        function stopScanner() {
            const placeholder = document.getElementById('scanner-placeholder');
            placeholder.style.display = 'flex';
            if(html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode = null; document.getElementById('reader').innerHTML = ''; }).catch(() => {});
            }
        }

        function addContactManual() {
            const id = document.getElementById('manual-id-input').value.replace(/\D/g, '').slice(0, 4);
            const name = document.getElementById('contact-name-input').value.trim();
            if(/^\d{4}$/.test(id)) addContact(id, name);
            else alert("Código inválido.");
        }

        function addContact(id, name) {
            if(id === myId) return alert("Você não pode se adicionar.");
            contacts[id] = normalizeContact(id, { customName: name });
            delete deletedConversations[id];
            saveContacts();
            saveDeletedConversations();
            showScreen('main-screen');
            openChat(id);
        }

        function deleteConversation(e, id) {
            e.stopPropagation();
            if(confirm("Apagar conversa da tela inicial? O contato continuará salvo na sua lista.")) {
                deletedConversations[id] = Date.now();
                saveDeletedConversations();
                document.getElementById('contact-profile-modal').style.display = 'none';
                showScreen('main-screen');
            }
        }

        function removeContactCompletely(e, id) {
            e.stopPropagation();
            if(confirm("Excluir contato permanentemente? Isso apagará a conversa e o contato da sua lista para sempre.")) {
                delete contacts[id];
                delete messagesStore[id];
                delete unreadCounts[id];
                saveContacts();
                saveMessages();
                saveUnread();
                document.getElementById('contact-profile-modal').style.display = 'none';
                showScreen('main-screen');
            }
        }

        function showContactProfile(id) {
            const c = contacts[id];
            if(!c) return;
            document.getElementById('contact-profile-pic-modal').src = c.pic || 'https://www.w3schools.com/howto/img_avatar.png';
            document.getElementById('contact-edit-name-input').value = getContactDisplayName(id, c);
            document.getElementById('contact-profile-id-modal').innerText = "ID: " + id;
            document.getElementById('contact-profile-modal').style.display = 'flex';
        }

        function updateContactName() {
            const newName = document.getElementById('contact-edit-name-input').value.trim();
            if(!newName || !activeChatId) return;
            contacts[activeChatId].customName = newName;
            saveContacts();
            document.getElementById('chat-username').innerText = newName;
            alert("Nome atualizado!");
        }

        function generateQR(text) {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            document.getElementById('qrcode-display').innerHTML = qr.createImgTag(5);
        }

        document.getElementById('message-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
        document.getElementById('message-input').oninput = function() {
            const sendBtn = document.getElementById('send-btn');
            const voiceBtn = document.getElementById('voice-btn');
            if(this.value.trim().length > 0) { sendBtn.style.display = 'block'; voiceBtn.style.display = 'none'; }
            else { sendBtn.style.display = 'none'; voiceBtn.style.display = 'block'; }
        };

        init();
    </script>
</body>
</html>
